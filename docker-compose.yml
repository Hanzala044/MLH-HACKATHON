services:
  postgres:
    image: postgres:16-alpine
    container_name: receiptwise-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: receiptwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: receiptwise-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: receiptwise-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:dev@postgres:5432/receiptwise
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecret-dev-jwt-key-for-hackathon-2026
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
